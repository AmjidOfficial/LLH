<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Sign in | Legacy Leathers Private Workspace</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#f5ecde;color:#24150e;font-family:'DM Sans',Arial,sans-serif}.login-shell{width:min(420px,100%);background:#fffdfa;border:1px solid #e3d8ca;padding:clamp(24px,6vw,42px)}.brand{text-align:center;margin-bottom:35px}.brand b{display:block;font:700 42px 'Playfair Display',Georgia,serif;letter-spacing:.15em}.brand span{font-size:8px;letter-spacing:.22em}.eyebrow{font-size:9px;letter-spacing:.18em;color:#a87549;font-weight:700}h1{font:500 32px 'Playfair Display',Georgia,serif;margin:8px 0}p{font-size:12px;color:#7d7166;line-height:1.7}label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin:20px 0 7px}input{width:100%;height:48px;padding:0 13px;border:1px solid #d9cfc2;background:#fff;font:14px 'DM Sans',Arial,sans-serif}button{width:100%;height:48px;margin-top:12px;border:0;background:#24150e;color:#fff5e7;font:600 10px 'DM Sans',Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}button:disabled{opacity:.5}.secondary{background:transparent;color:#6c5844;border:1px solid #d8cabb}.msg{min-height:24px;font-size:11px;color:#775333;margin-top:12px}[hidden]{display:none!important}</style></head><body><main class="login-shell"><div class="brand"><a href="/"><img src="/legacy-leathers-logo.svg" alt="Legacy Leathers since 1998" style="width:150px;height:92px;object-fit:contain;margin:0 auto 8px"></a></div><p class="eyebrow">YOUR STORE WORKSPACE</p><h1 id="title">Sign in</h1><p id="sub">Enter your email. We will send you a one-time sign-in code.</p><form id="loginForm"><div id="emailRow"><label for="email">Email address</label><input id="email" type="email" required autocomplete="username webauthn" placeholder="you@example.com"></div><div id="codeRow" hidden><label for="code">6-digit code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div><button id="submit">Send sign-in code</button><button id="back" type="button" class="secondary" hidden>Use another email</button></form><div id="passkey" hidden><p>Add a passkey to sign in next time with your fingerprint, face or device screen lock.</p><button id="passkeyAdd">Add passkey</button><button id="passkeySkip" class="secondary">Not now</button></div><p id="msg" class="msg" role="status" aria-live="polite"></p></main><script>(function(){const A=window.hatchable?.auth,$=s=>document.querySelector(s);let step='email',hasPasskey=false;const next=(()=>{const v=new URLSearchParams(location.search).get('next')||'/portal.html';return v.startsWith('/')&&!v.startsWith('//')&&!v.includes('\\')?v:'/portal.html'})();function done(){location.replace(next)}function say(t){$('#msg').textContent=t}if(!A){say('Sign-in is not ready. Refresh this page.');$('#submit').disabled=true;return}A.getSession().then(s=>{if(s?.user)done()}).catch(()=>{});$('#loginForm').onsubmit=async e=>{e.preventDefault();const btn=$('#submit');btn.disabled=true;try{if(step==='email'){const email=$('#email').value.trim();const r=await A.startLogin({email});hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys()){try{const p=await A.signInWithPasskey({email});if(p?.user){done();return}}catch(e){}}step='code';$('#emailRow').hidden=true;$('#codeRow').hidden=false;$('#back').hidden=false;btn.textContent='Verify code';$('#sub').textContent='Enter the code sent to '+email;say('Code sent.');$('#code').focus()}else{const r=await A.verifyCode({email:$('#email').value.trim(),code:$('#code').value.trim()});if(!r?.user)throw new Error('That code did not work.');if(!hasPasskey&&A.supportsPasskeys()&&localStorage.getItem('legacy-leather-house-passkey-declined')!=='1'){$('#loginForm').hidden=true;$('#passkey').hidden=false;$('#title').textContent='You are signed in';$('#sub').textContent='Make your next sign-in faster with a passkey.'}else done()}}catch(err){say(err.message||'Please try again.')}finally{btn.disabled=false}};$('#back').onclick=()=>{step='email';$('#emailRow').hidden=false;$('#codeRow').hidden=true;$('#back').hidden=true;$('#submit').textContent='Send sign-in code';say('')};$('#passkeyAdd').onclick=async()=>{try{await A.registerPasskey()}catch(e){}done()};$('#passkeySkip').onclick=()=>{localStorage.setItem('top-passkey-declined','1');done()}})();</script></body></html>
