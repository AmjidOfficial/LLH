<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 460" role="img" aria-labelledby="t d">
<title id="t">Legacy Leathers, Since 1998</title><desc id="d">The Legacy Leathers LL monogram and wordmark on an embossed dark brown leather plaque in antique gold.</desc>
<defs>
 <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#68452d"/><stop offset=".42" stop-color="#3d2417"/><stop offset="1" stop-color="#1d100a"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8e4b5"/><stop offset=".25" stop-color="#c99c54"/><stop offset=".52" stop-color="#f2d89c"/><stop offset=".76" stop-color="#9b6b36"/><stop offset="1" stop-color="#eed49a"/></linearGradient>
 <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" seed="9" result="n"/><feColorMatrix in="n" type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .17"/></feComponentTransfer><feBlend in="SourceGraphic" mode="soft-light"/></filter>
 <filter id="emboss" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="2.1" result="blur"/><feOffset in="blur" dx="1.8" dy="3" result="dark"/><feFlood flood-color="#090503" flood-opacity=".85"/><feComposite in2="dark" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <linearGradient id="shine" x2="0" y2="1"><stop stop-color="#fff1cb" stop-opacity=".28"/><stop offset=".18" stop-color="#fff1cb" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient>
</defs>
